name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Keep install scripts enabled: WebTorrent needs native node-datachannel.
      - run: npm ci
      - run: npm test
      - run: npm run test:peers
      - run: npm run typecheck
      - run: npm run lint

  # Release notes (docs/releases.md): every PR adds a note or is a release that consumes them
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: github.event_name == 'pull_request'
        run: node tools/scripts/check-changesets.mjs --base origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: node tools/scripts/check-changesets.mjs

  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload playback failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playback-test-results
          path: test-results/
          retention-days: 7
