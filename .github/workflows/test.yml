name: Tests

# Pull requests run here once; pushes only for main, so a PR branch isn't tested twice.
# Run a branch without a pull request from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch supersedes the run in progress
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Keep install scripts enabled: WebTorrent needs native node-datachannel.
      - run: npm ci
      - run: npm test
      - run: npm run test:peers
      - run: npm run typecheck
      - run: npm run lint

  # Release notes (docs/releases.md): every PR adds a note. Release branches are the prepared version.
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: npm run release -- status --since origin/${{ github.base_ref }}
      - if: github.event_name != 'pull_request'
        run: npm run release -- status

  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload playback failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playback-test-results
          path: test-results/
          retention-days: 7
