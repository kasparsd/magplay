name: Publish container image

# Every push to main moves the `edge` tag; older edge builds are deleted.
# Publishing a GitHub release tagged vX.Y.Z publishes `X.Y.Z`, `X.Y` and `X` (`X` is skipped for 0.x).
# A prerelease (marked as such, or tagged like vX.Y.Z-rc.1) publishes only its exact version.
# No `latest` tag: deployments pin a version or follow `edge` explicitly.
# tag-release.yml dispatches this workflow on the tag, because a release it publishes
# with GITHUB_TOKEN raises no `release` event. The tags come from github.ref either way.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  # A newer main build supersedes an older one; release builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node-datachannel has native dependencies, so build both advertised platforms
      # instead of publishing an image that only works on amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is disabled for now; GHCR is the only registry.
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # To also publish to Docker Hub, re-enable its login above and use:
          # images: |
          #   ghcr.io/${{ github.repository }}
          #   kasparsd/magplay
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # semver already skips {{major}}.{{minor}} and {{major}} for tags like v1.2.0-rc.1;
          # the enable check also covers releases marked as prerelease on GitHub.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=edge

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations are stored as extra untagged package versions.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Delete untagged versions, such as the edge builds `edge` has moved past,
      # while keeping the platform images that tagged multi-arch images point to.
      # older-than spares images that a concurrent publish is still pushing.
      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          package: ${{ github.event.repository.name }}
          delete-untagged: true
          older-than: 1 hour
