name: Tag release

# Merging the release pull request tags v<version> and publishes the GitHub Release.
# A release published with GITHUB_TOKEN does not start publish-image.yml,
# so the image build is dispatched on the tag (workflow_dispatch always runs).
on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: tag
        run: npm run release -- tag --push --github-output
      - if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.tag.outputs.notes }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES"
      - if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-image.yml --ref ${{ steps.tag.outputs.tag }}
