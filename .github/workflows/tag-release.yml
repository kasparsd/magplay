name: Tag release

# Merging the release pull request tags v<version> and publishes the GitHub Release.
# publish-image.yml builds the versioned image from that published release.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next'
    runs-on: ubuntu-latest
    steps:
      - id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN is not set, so the release tag was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: .nvmrc

      - if: steps.token.outputs.present == 'true'
        run: npm run release -- tag --push --json > "$RUNNER_TEMP/tag.json"

      - if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          tag=$(jq -r .tag "$RUNNER_TEMP/tag.json")
          if [ "$tag" = "null" ]; then
            echo "The current version has no changelog section, so it is not tagged."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub Release."
            exit 0
          fi
          jq -r .notes "$RUNNER_TEMP/tag.json" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "${{ github.event.pull_request.merge_commit_sha }}" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
