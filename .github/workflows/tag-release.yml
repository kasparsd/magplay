name: Tag release

# Merging the release pull request tags v<version> and publishes the GitHub Release.
# publish-image.yml builds the versioned image from that published release.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npm run release -- publish
