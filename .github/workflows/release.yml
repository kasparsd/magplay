name: Release

# Changesets opens a version pull request when notes are on main. Merging it
# leaves no notes, so the same push publishes a GitHub release tagged vX.Y.Z
# and the matching container image. Packages are not published to npm.
# A release created with the built-in token does not trigger other workflows,
# so the image is tagged here rather than by publish-image.yml.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Version or publish the application
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run release:version
          publish-script: npm run release:publish
          commit-message: chore: version application
          pr-title: chore: version application

      - name: Read the published version
        id: published
        if: hashFiles('.release-version') != ''
        run: echo "version=$(tr -d '[:space:]' < .release-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.published.outputs.version
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.version
      - name: Log in to GHCR
        if: steps.published.outputs.version
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add image tags
        id: tags
        if: steps.published.outputs.version
        run: |
          version="${{ steps.published.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          tags="$image:$version"
          if [[ "$version" != *-* ]]; then
            tags="$tags,$image:${version%.*}"
            major="${version%%.*}"
            if [[ "$major" != 0 ]]; then tags="$tags,$image:$major"; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.published.outputs.version
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
