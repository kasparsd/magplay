apiVersion: 1
datasources:
  - name: Magplay metrics
    uid: magplay-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Magplay logs
    uid: magplay-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
