<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>magplay</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">magplay</a>
    <a class="navlink" href="/explore">Explore</a>
    <form id="search" class="topsearch" action="/" role="search">
      <input name="q" type="search" placeholder="Search or paste a magnet link…" aria-label="Search" autofocus required>
      <button>Search</button>
    </form>
  </header>
  <main>
    <div id="toolbar" class="toolbar" hidden>
      <div class="seg" role="radiogroup" aria-label="Category">
        <label><input type="radio" aria-label="All" name="cat" value="" form="search" checked><span>All</span></label>
        <label><input type="radio" aria-label="Movies" name="cat" value="2000" form="search"><span>Movies</span></label>
        <label><input type="radio" aria-label="TV" name="cat" value="5000" form="search"><span>TV</span></label>
        <label><input type="radio" aria-label="Audio" name="cat" value="3000" form="search"><span>Audio</span></label>
        <label><input type="radio" aria-label="Software" name="cat" value="4000" form="search"><span>Software</span></label>
        <label><input type="radio" aria-label="Books" name="cat" value="7000" form="search"><span>Books</span></label>
        <label><input type="radio" aria-label="Other" name="cat" value="8000" form="search"><span>Other</span></label>
      </div>
      <p id="status" class="status"></p>
    </div>
    <div id="sources" class="chips"></div>
    <ul id="source-errors" class="source-errors"></ul>
    <section id="recent" hidden></section>
    <ul id="results" class="releases" hidden></ul>
  </main>
  <script type="module" src="/src/search.js"></script>
</body>
</html>
