<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>magplay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">magplay</a>
    <a class="navlink" href="/explore">Explore</a>
    <form class="topsearch" action="/" role="search"><input name="q" type="search" placeholder="Search" aria-label="Search"></form>
  </header>
  <main class="wide">
    <p class="back"><a id="back" href="/">← Files</a></p>
    <h1 id="title"></h1>
    <div id="stage">
      <video id="video" playsinline></video>
      <div id="overlay" aria-live="polite"></div>
      <div id="controls" hidden>
        <button id="playpause" type="button" aria-label="Play or pause">▶</button>
        <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="Position">
        <span id="time">0:00 / 0:00</span>
        <button id="mute" type="button" aria-label="Mute or unmute">🔊</button>
        <button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
    <div id="pieces" title="Downloaded parts of the file"></div>
    <div class="options">
      <label>Audio <select id="audio"></select></label>
      <label>Subtitles <select id="subs"><option value="">Off</option></select></label>
      <span id="openin"></span>
    </div>
    <div id="next" class="next" hidden></div>
    <details id="details" class="details">
      <summary>ⓘ Details</summary>
      <dl id="facts"></dl>
    </details>
  </main>
  <script type="module" src="/player.js"></script>
</body>
</html>
